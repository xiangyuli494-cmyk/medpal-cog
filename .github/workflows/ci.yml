name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: 建种子库
        run: python mcp-server/seed.py --reset
      - name: 单元与冒烟测试
        run: python -m pytest tests -q
      - name: 契约校验（工具数与返回结构）
        run: python tools/check_evaluator.py

  pipeline:
    name: pipeline (skeleton + eval)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python mcp-server/seed.py --reset
      - name: Walking Skeleton 通电
        run: python skeleton.py
      - name: 离线评测
        run: python eval/run_eval.py
      - name: 评测报告留档
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/
          if-no-files-found: warn
